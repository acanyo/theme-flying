    <linearGradient id="grid-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".42" stop-color="#09090b" stop-opacity="0"/>
      <stop offset="1" stop-color="#09090b" stop-opacity=".76"/>
    </linearGradient>
    <clipPath id="grid-window">
