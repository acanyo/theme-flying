<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="title desc">
  <title id="title">网格布局预览</title>
  <desc id="desc">一张主文章卡片和四张辅助文章卡片组成的精选文章网格</desc>
  <defs>
    <linearGradient id="grid-lead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71717a"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="grid-card-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4d4d8"/>
      <stop offset="1" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="grid-card-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a1a1aa"/>
      <stop offset="1" stop-color="#52525b"/>
