<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="title desc">
  <title id="title">轮播布局预览</title>
  <desc id="desc">左侧文章信息与右侧封面图片组成的分栏文章轮播</desc>
  <defs>
    <linearGradient id="carousel-media" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a1a1aa"/>
      <stop offset=".48" stop-color="#52525b"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="carousel-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".42" stop-color="#09090b" stop-opacity="0"/>
      <stop offset="1" stop-color="#09090b" stop-opacity=".46"/>
    </linearGradient>
    <clipPath id="carousel-window">
      <rect x="11" y="11" width="298" height="178" rx="11"/>
    </clipPath>
    <clipPath id="carousel-image">
      <rect x="175" y="63" width="119" height="92" rx="8"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="318" height="198" rx="15" fill="#fafafa" stroke="#d4d4d8" stroke-width="2"/>
  <g clip-path="url(#carousel-window)">
    <rect x="11" y="11" width="298" height="178" fill="#fff"/>

    <g aria-hidden="true">
      <circle cx="25" cy="26" r="5" fill="#18181b"/>
      <rect x="35" y="23" width="29" height="6" rx="3" fill="#52525b"/>
      <rect x="218" y="23" width="17" height="5" rx="2.5" fill="#d4d4d8"/>
      <rect x="242" y="23" width="17" height="5" rx="2.5" fill="#d4d4d8"/>
      <rect x="266" y="23" width="17" height="5" rx="2.5" fill="#d4d4d8"/>
      <circle cx="296" cy="26" r="5" fill="#e4e4e7"/>
      <path d="M11 42.5h298" stroke="#e4e4e7"/>
    </g>

    <g aria-hidden="true">
      <rect x="23" y="53" width="284" height="124" rx="12" fill="#f4f4f5"/>

      <circle cx="43" cy="72" r="8" fill="#52525b" stroke="#fff" stroke-width="2"/>
      <circle cx="56" cy="72" r="8" fill="#a1a1aa" stroke="#f4f4f5" stroke-width="2"/>
      <rect x="35" y="88" width="46" height="4" rx="2" fill="#a1a1aa"/>
      <circle cx="87" cy="90" r="2" fill="#d4d4d8"/>
      <rect x="93" y="88" width="25" height="4" rx="2" fill="#a1a1aa"/>
      <rect x="35" y="101" width="112" height="8" rx="4" fill="#27272a"/>
      <rect x="35" y="114" width="87" height="6" rx="3" fill="#52525b"/>
      <rect x="35" y="128" width="101" height="4" rx="2" fill="#a1a1aa"/>
      <rect x="35" y="136" width="69" height="4" rx="2" fill="#d4d4d8"/>
      <rect x="35" y="150" width="48" height="17" rx="8.5" fill="#18181b"/>
      <path d="M68 156.5h5m-2-2 2 2-2 2" fill="none" stroke="#fff" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>

      <g clip-path="url(#carousel-image)">
        <rect x="175" y="63" width="119" height="92" fill="url(#carousel-media)"/>
        <circle cx="267" cy="82" r="27" fill="#fff" fill-opacity=".07"/>
        <path d="m175 127 29-27 24 22 15-14 51 47H175z" fill="#18181b" fill-opacity=".24"/>
        <rect x="175" y="63" width="119" height="92" fill="url(#carousel-shade)"/>
        <rect x="248" y="137" width="37" height="10" rx="4" fill="#09090b" fill-opacity=".58"/>
      </g>

      <circle cx="135" cy="159" r="9" fill="#e4e4e7"/>
      <path d="m137 156-3 3 3 3" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="155" cy="159" r="9" fill="#fff"/>
      <path d="m153 156 3 3-3 3" fill="none" stroke="#18181b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
