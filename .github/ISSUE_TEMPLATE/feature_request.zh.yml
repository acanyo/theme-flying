name: 新功能建议
description: 为 Fly 主题提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    id: preface
    attributes:
      value: "感谢你为 Fly 主题提供建议！提交前请先搜索现有 Issue，避免重复反馈。"
  - type: markdown
    id: environment
    attributes:
      value: "## 环境信息"
  - type: input
    id: theme-version
    attributes:
      label: "当前使用的 Fly 主题版本"
      description: "可以在 Halo 管理后台的主题详情中找到。"
      placeholder: "例如：1.0.0"
  - type: markdown
    id: details
    attributes:
      value: "## 建议详情"
  - type: textarea
    id: description
    attributes:
      label: "功能描述"
      description: "请说明希望解决的问题、期望的交互或使用场景。"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "可选方案"
      description: "如果你考虑过其他实现方式，可以在这里补充。"
  - type: textarea
    id: additional-information
    attributes:
      label: "补充信息"
      description: "可以在这里提供参考链接、截图或其他信息。"
