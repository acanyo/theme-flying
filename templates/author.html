<!DOCTYPE html>
<html
  lang="zh-CN"
  th:replace="~{fragments/layout :: page(pageTitle=|${author.displayName} - ${site.title}|, bodyClass='fly-author', content=~{::content})}"
>
  <th:block th:fragment="content">
    <div class="fly-content-shell">
      <header class="fly-page-header fly-author-header">
        <div class="fly-author-hero">
          <img
            class="fly-author-hero-avatar"
            src="/assets/images/avatar.svg"
            th:src="${author.avatar ?: #theme.assets('/images/avatar.svg')}"
            th:alt="${author.displayName ?: site.title}"
            alt=""
            loading="eager"
          />
          <div>
            <p class="fly-eyebrow">作者</p>
            <h1 th:text="${author.displayName ?: site.title}">作者</h1>
            <p th:text="|${posts.total} 篇文章|">0 篇文章</p>
          </div>
        </div>
      </header>

      <th:block th:replace="~{fragments/post-list :: grid(${posts})}"></th:block>
      <th:block th:replace="~{fragments/pagination :: pager(${posts})}"></th:block>
    </div>
  </th:block>
</html>
