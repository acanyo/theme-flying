<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200" role="img" aria-labelledby="title desc">
  <title id="title">横幅布局预览</title>
  <desc id="desc">使用全宽背景图片、居中标题和分页控制的焦点文章横幅</desc>
  <defs>
    <linearGradient id="slider-scene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71717a"/>
      <stop offset=".55" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="slider-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#09090b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#09090b" stop-opacity=".64"/>
    </linearGradient>
    <clipPath id="slider-window">
      <rect x="11" y="11" width="298" height="178" rx="11"/>
    </clipPath>
    <clipPath id="slider-hero">
      <rect x="23" y="53" width="284" height="124" rx="9"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="318" height="198" rx="15" fill="#fafafa" stroke="#d4d4d8" stroke-width="2"/>
  <g clip-path="url(#slider-window)">
    <rect x="11" y="11" width="298" height="178" fill="#fff"/>

    <g aria-hidden="true">
      <circle cx="25" cy="26" r="5" fill="#18181b"/>
      <rect x="35" y="23" width="29" height="6" rx="3" fill="#52525b"/>
      <rect x="218" y="23" width="17" height="5" rx="2.5" fill="#d4d4d8"/>
      <rect x="242" y="23" width="17" height="5" rx="2.5" fill="#d4d4d8"/>
      <rect x="266" y="23" width="17" height="5" rx="2.5" fill="#d4d4d8"/>
      <circle cx="296" cy="26" r="5" fill="#e4e4e7"/>
      <path d="M11 42.5h298" stroke="#e4e4e7"/>
    </g>

    <g clip-path="url(#slider-hero)" aria-hidden="true">
      <rect x="23" y="53" width="284" height="124" fill="url(#slider-scene)"/>
      <circle cx="253" cy="77" r="48" fill="#fff" fill-opacity=".055"/>
      <path d="M23 134c42-27 82-27 122-5 43 23 91 15 162-31v79H23z" fill="#09090b" fill-opacity=".2"/>
      <rect x="23" y="53" width="284" height="124" fill="url(#slider-shade)"/>

      <rect x="141" y="75" width="38" height="10" rx="5" fill="#fff" fill-opacity=".2"/>
      <rect x="91" y="94" width="138" height="8" rx="4" fill="#fff" fill-opacity=".96"/>
      <rect x="113" y="108" width="94" height="5" rx="2.5" fill="#fff" fill-opacity=".54"/>
      <rect x="128" y="121" width="64" height="4" rx="2" fill="#fff" fill-opacity=".38"/>
      <path d="M121 137h78" stroke="#fff" stroke-opacity=".24"/>
      <circle cx="139" cy="145" r="4" fill="#fff" fill-opacity=".92"/>
      <rect x="147" y="143" width="31" height="4" rx="2" fill="#fff" fill-opacity=".52"/>

      <circle cx="39" cy="115" r="10" fill="#09090b" fill-opacity=".52"/>
      <path d="m41 111-4 4 4 4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="291" cy="115" r="10" fill="#09090b" fill-opacity=".52"/>
      <path d="m289 111 4 4-4 4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="145" y="165" width="16" height="4" rx="2" fill="#fff"/>
      <circle cx="168" cy="167" r="2" fill="#fff" fill-opacity=".46"/>
      <circle cx="177" cy="167" r="2" fill="#fff" fill-opacity=".46"/>
    </g>
  </g>
</svg>
