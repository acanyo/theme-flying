<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{fragments/layout :: page(pageTitle=|Tags - ${site.title}|, bodyClass='flying-taxonomy', content=~{::content})}"
>
  <th:block th:fragment="content">
    <div class="content-shell">
      <header class="page-header">
        <p class="eyebrow">Browse</p>
        <h1>Tags</h1>
        <p>Find related notes across the archive.</p>
      </header>

      <nav class="tag-cloud" aria-label="Tag list">
        <a th:each="tag : ${tags}" class="tag-pill" th:href="@{${tag.status.permalink}}">
          <span th:text="${tag.spec.displayName}">Tag</span>
          <small th:text="${tag.postCount}">0</small>
        </a>
      </nav>
    </div>
  </th:block>
</html>
