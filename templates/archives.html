<!DOCTYPE html><html lang="zh-CN" th:replace="~{fragments/layout :: page(pageTitle=|${theme.config.pages?.archives_title ?: '文章归档'} - ${site.title}|, pageKind='archive', pageUrl=${site.url + site.routes.archivesUri}, bodyClass='fly-archive', content=~{::content})}"> <th:block th:fragment="content"> <div class="fly-content-shell"> <div class="fly-archive-page" data-fly-feed-region th:with="archiveTags=${tagFinder.listAll()}"> <th:block th:replace="~{fragments/taxonomy/hero :: hero(title=${theme.config.pages?.archives_title ?: '文章归档'}, description=${theme.config.pages?.archives_description ?: '汇集站点发布的全部文章，涵盖技术、生活与更多主题，在这里按时间探索感兴趣的内容。'}, imageUrl=${theme.config.pages?.archives_cover}, fallbackImagePath=${'/images/archive-hero.webp'})}"></th:block> <nav class="fly-archive-nav fly-horizontal-nav" data-fly-taxonomy-carousel data-fly-reveal aria-label="文章标签导航"> <div id="fly-archive-nav-rail" class="fly-archive-nav-rail fly-horizontal-nav-rail" data-fly-taxonomy-carousel-rail> <a class="fly-archive-nav-item fly-horizontal-nav-item fly-is-active" href="/archives" th:href="@{/archives}" aria-current="page" data-fly-taxonomy-carousel-item>全部文章</a> <a class="fly-archive-nav-item fly-horizontal-nav-item" href="/" data-fly-taxonomy-carousel-item th:each="archiveTag : ${archiveTags}" th:href="@{${archiveTag.status.permalink}}" th:text="${archiveTag.spec.displayName}">标签</a> </div> <th:block th:replace="~{fragments/horizontal-nav-arrow :: arrow(direction=${'prev'}, label=${'向前浏览文章标签'}, railId=${'fly-archive-nav-rail'}, controller=${'taxonomy-carousel'}, modifierClass=${'fly-archive-nav-arrow fly-archive-nav-arrow--prev'})}"></th:block> <th:block th:replace="~{fragments/horizontal-nav-arrow :: arrow(direction=${'next'}, label=${'向后浏览文章标签'}, railId=${'fly-archive-nav-rail'}, controller=${'taxonomy-carousel'}, modifierClass=${'fly-archive-nav-arrow fly-archive-nav-arrow--next'})}"></th:block> </nav> <th:block th:replace="~{fragments/archive/feed :: feed(archives=${archives}, feedId=${
