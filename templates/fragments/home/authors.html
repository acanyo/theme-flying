<th:block
  th:fragment="authors(posts)"
  th:if="${posts != null and not #lists.isEmpty(posts.items)}"
  th:with="authors=${#sets.toSet(posts.items.?[owner != null].![owner])}"
>
  <section
    class="fly-authors-section"
    aria-labelledby="fly-authors-heading"
    th:if="${not #sets.isEmpty(authors)}"
    data-fly-carousel
  >
    <header class="fly-section-heading fly-authors-heading">
      <div>
        <p class="fly-eyebrow">作者</p>
        <h2 id="fly-authors-heading">我们的作者</h2>
        <p>认识这些持续分享见解与故事的创作者。</p>
      </div>
      <div class="fly-author-controls" aria-label="作者列表翻页">
        <button
          class="fly-carousel-arrow fly-carousel-arrow--prev"
          type="button"
          aria-label="查看上一组作者"
          data-fly-carousel-prev
        >
          <span class="fly-iconify fly-iconify--chevron" aria-hidden="true"></span>
        </button>
        <button
          class="fly-carousel-arrow fly-carousel-arrow--next"
          type="button"
          aria-label="查看下一组作者"
          data-fly-carousel-next
        >
          <span class="fly-iconify fly-iconify--chevron" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div class="fly-authors-list" data-fly-carousel-rail>
      <article
        class="fly-author-card"
        th:each="author, authorStat : ${authors}"
        th:if="${author != null and authorStat.index < 8}"
        data-fly-carousel-item
      >
        <a
          class="fly-author-card-link"
          href="/"
          th:href="@{${author.permalink ?: '/'}}"
          th:aria-label="|查看 ${author.displayName ?: site.title} 的作者主页|"
        >
          <span class="fly-author-portrait">
            <img
              src="/assets/images/avatar.svg"
              th:src="${author.avatar ?: #theme.assets('/images/avatar.svg')}"
              th:alt="${author.displayName ?: site.title}"
              alt=""
              loading="lazy"
              decoding="async"
            />
          </span>
          <span class="fly-author-copy">
            <strong class="fly-author-name" th:text="${author.displayName ?: site.title}">作者</strong>
            <span class="fly-author-link-label">查看作者主页</span>
          </span>
        </a>
      </article>
    </div>
  </section>
</th:block>
