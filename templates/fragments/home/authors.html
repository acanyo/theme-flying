<!DOCTYPE html><th:block th:fragment="authors(posts)" th:if="${posts != null and not #lists.isEmpty(posts.items)}" th:with="authors=${#sets.toSet(posts.items.?[owner != null].![owner])}"> <section class="fly-authors-section" aria-labelledby="fly-authors-heading" th:if="${not #sets.isEmpty(authors)}" th:attr="data-fly-author-count=${authors.size()}" data-fly-carousel> <header class="fly-section-heading fly-authors-heading" data-fly-reveal> <h2 id="fly-authors-heading">我们的作者</h2> <a class="fly-section-action" href="/authors" data-fly-motion-button> <span class="fly-motion-label"> <span class="fly-motion-label-copy">全部作者</span> <span class="fly-motion-label-copy" aria-hidden="true">全部作者</span> </span> <span class="fly-motion-icon" aria-hidden="true">→</span> </a> </header> <div class="fly-authors-carousel"> <div class="fly-authors-list" data-fly-carousel-rail data-fly-reveal-group> <article class="fly-author-card" th:each="author, authorStat : ${authors}" th:if="${author != null and authorStat.index < 8}" th:with="authorBackground=${#annotations.getOrDefault(author, 'fly_author_background', '')}" data-fly-carousel-item> <a class="fly-author-card-link" href="/" th:href="@{${author.permalink ?: '/'}}" th:aria-label="|查看 ${author.displayName ?: site.title} 的作者主页|"> <span class="fly-author-portrait"> <img src="/assets/images/avatar.svg" th:src="${#strings.isEmpty(authorBackground) ? (author.avatar ?: #theme.assets('/images/avatar.svg')) : authorBackground}" th:alt="${author.displayName ?: site.title}" alt="" loading="lazy" decoding="async"> </span> <span class="fly-author-copy"> <strong class="fly-author-name" th:text="${author.displayName ?: site.title}">作者</strong> <span class="fly-author-link-label" th:if="${not #strings.isEmpty(author.bio)}" th:text="${author.bio}">作者简介</span> </span> </a> </article> </div> <div class="fly-author-controls" aria-label="作者列表导航"> <button class="fly-carousel-arrow fly-carousel-arrow--prev" type="button" aria-label="查看上一组作者" data-fly-carousel-prev> <span class="fly-iconify fly-iconify--arrow-right" aria-hidden="true"></span> </button> <button class="fly-carousel-arrow fly-carousel-arrow--next" type="button" aria-label="查看下一组作者" data-fly-carousel-next> <span class="fly-iconify fly-iconify--arrow-right" aria-hidden="true"></span> </button> </div> </div> </section> </th:block>
