<!DOCTYPE html><article class="fly-overlay-post-card" th:fragment="card(post)" data-fly-post-card th:attr="data-fly-post-name=${post.metadata.name},data-fly-category=${not #lists.isEmpty(post.categories) ? post.categories[0].metadata.name : 'uncategorized'},data-fly-title=${post.spec.title},data-fly-excerpt=${post.status.excerpt ?: ''}"> <a class="fly-overlay-post-hit" href="/" th:href="@{${post.status.permalink}}" th:attr="aria-label=|阅读：${post.spec.title}|"></a> <img class="fly-overlay-post-image" src="/assets/images/fallback-cover.svg" th:src="${#strings.isEmpty(post.spec.cover) ? #theme.assets('/images/fallback-cover.svg') : post.spec.cover}" th:alt="${post.spec.title}" alt="" loading="lazy"> <div class="fly-overlay-post-shade" aria-hidden="true"></div> <div class="fly-overlay-post-content"> <h3> <a href="/" th:href="@{${post.status.permalink}}" th:text="${post.spec.title}">文章标题</a> </h3> <p class="fly-overlay-post-meta"> <span th:text="${post.owner?.displayName ?: site.title}">作者</span> <span aria-hidden="true">·</span> <time th:datetime="${post.spec.publishTime}" th:text="${#dates.format(post.spec.publishTime, 'yyyy年MM月dd日')}">2024年7月11日</time> <span th:if="${not #lists.isEmpty(post.categories)}" aria-hidden="true">·</span> <span th:if="${not #lists.isEmpty(post.categories)}" th:text="${post.categories[0].spec.displayName}">分类</span> </p> </div> </article>
