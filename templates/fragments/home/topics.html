<!DOCTYPE html><section class="fly-topic-section" aria-label="精选分类" th:fragment="topics(categories, homeLayout)" th:if="${not #lists.isEmpty(categories)}" th:with="topicLimit=${4},topicPostsLimit=${8}"> <th:block th:each="category, catIter : ${categories}" th:if="${catIter.index < topicLimit}" th:with="categoryPosts=${postFinder.list({ page: 1, size: topicPostsLimit, categoryName: category.metadata.name })}"> <section class="fly-topic-block" data-fly-carousel data-fly-carousel-buttons-only th:if="${categoryPosts != null and not #lists.isEmpty(categoryPosts.items)}"> <header class="fly-topic-header" data-fly-reveal> <div> <h2> <a href="/" th:href="@{${category.status.permalink}}" th:text="${category.spec.displayName}">分类</a> </h2> <p th:if="${not #strings.isEmpty(category.spec.description)}" th:text="${category.spec.description}">
分类简介
</p> </div> <th:block th:with="targetHref=${category.status.permalink}, label=|查看${category.spec.displayName}|"> <th:block th:replace="~{fragments/section-view-link :: link(targetHref=${targetHref}, label=${label})}"></th:block> </th:block> </header> <div class="fly-topic-rail" data-fly-carousel-rail data-fly-reveal-group th:id="${'fly-topic-' + category.metadata.name}"> <th:block th:each="post : ${categoryPosts.items}"> <div class="fly-topic-slide" data-fly-carousel-item> <th:block th:replace="~{fragments/article-card :: card(post=${post}, variant=${homeLayout == 'grid' ? 'overlay' : (homeLayout == 'carousel' ? 'carousel' : (homeLayout == 'slider' ? 'slider' : 'standard'))})}"></th:block> </div> </th:block> </div> <th:block th:replace="~{fragments/home/featured :: carouselControls(label=${category.spec.displayName}, railId=${'fly-topic-' + category.metadata.name})}"></th:block> </section> </th:block> </section>
