<!DOCTYPE html><div class="fly-author-popover-trigger" th:fragment="trigger(author, fallbackPermalink, variant)" th:classappend="${variant == 'named' ? ' fly-author-popover-trigger--named' : (variant == 'name' ? ' fly-author-popover-trigger--name-only' : '')}" th:with="authorName=${author.displayName ?: site.title},authorPermalink=${author.permalink ?: fallbackPermalink},authorAvatar=${author.avatar ?: #theme.assets('/images/avatar.svg')},authorQq=${#annotations.getOrDefault(author, 'fly_qq', '')},authorWechat=${#annotations.getOrDefault(author, 'fly_wechat', '')},authorEmail=${#annotations.getOrDefault(author, 'fly_email', '')},authorWebsite=${#annotations.getOrDefault(author, 'fly_website', '')}" th:attr="data-fly-author-name=${authorName},data-fly-author-permalink=${authorPermalink},data-fly-author-avatar=${authorAvatar},data-fly-author-bio=${author.bio ?: ''},data-fly-author-qq=${authorQq},data-fly-author-wechat=${authorWechat},data-fly-author-email=${authorEmail},data-fly-author-website=${authorWebsite}"> <a class="fly-author-popover-anchor" href="/" th:href="@{${authorPermalink}}" th:aria-label="|查看作者：${authorName}|" aria-haspopup="true" aria-expanded="false" aria-controls="fly-author-popover" data-fly-author-popover-anchor> <img th:if="${variant != 'name'}" src="/assets/images/avatar.svg" th:src="${authorAvatar}" th:alt="${authorName}" alt="" width="28" height="28" loading="lazy" decoding="async"> <span class="fly-author-popover-label" th:if="${variant != 'avatar'}" th:text="${authorName}">作者</span> </a> </div> <div id="fly-author-popover" class="fly-author-popover" th:fragment="popover" th:attr="data-fly-author-fallback-avatar=${#theme.assets('/images/avatar.svg')}" popover="manual" data-fly-author-popover role="group" aria-label="作者联系信息"> <a class="fly-author-popover-avatar" href="/" aria-label="查看作者主页" data-fly-author-popover-profile> <img src="/assets/images/avatar.svg" th:src="${#theme.assets('/images/avatar.svg')}" alt="" width="46" height="46" loading="lazy" decoding="async" data-fly-author-popover-avatar> </a> <a class="fly-author-popover-name" href="/" data-fly-author-popover-profile data-fly-author-popover-name>作者</a> <p class="fly-author-popover-bio" hidden data-fly-author-popover-bio></p> <ul class="fly-author-contacts fly-author-popover-contacts" hidden data-fly-author-popover-contacts> <li hidden data-fly-author-contact="qq"> <button class="fly-author-contact-action" type="button" data-fly-contact-copy data-fly-contact-label="QQ"> <span class="fly-iconify fly-iconify--qq" aria-hidden="true"></span> <span class="fly-author-contact-label">QQ</span> </button> </li> <li hidden data-fly-author-contact="wechat"> <button class="fly-author-contact-action" type="button" data-fly-contact-copy data-fly-contact-label="微信"> <span class="fly-iconify fly-iconify--wechat" aria-hidden="true"></span> <span class="fly-author-contact-label">微信</span> </button> </li> <li hidden data-fly-author-contact="email"> <a class="fly-author-contact-action" href="mailto:"> <span class="fly-iconify fly-iconify--mail" aria-hidden="true"></span> <span class="fly-author-contact-label">邮箱</span> </a> </li> <li hidden data-fly-author-contact="website"> <a class="fly-author-contact-action fly-author-contact-action--website" href="/" target="_blank" rel="noopener noreferrer"> <span class="fly-iconify fly-iconify--globe" aria-hidden="true"></span> <span class="fly-author-contact-label">网站</span> </a> </li> </ul> </div>
