<!DOCTYPE html><article class="fly-photo-card" th:fragment="card(photo, photoUrl)" th:attr="data-fly-photo-name=${photo.metadata.name}" data-fly-reveal> <a class="fly-photo-card-link" th:href="@{${photoUrl.detail(photo)}}"> <img class="fly-photo-card-image" src="/assets/images/fallback-cover.svg" th:src="${#strings.isEmpty(photo.spec.cover) ? photo.spec.url : photo.spec.cover}" th:alt="${photo.spec.displayName ?: ''}" loading="lazy" decoding="async"> <span class="fly-photo-card-shade" aria-hidden="true"></span> <span class="fly-photo-card-copy"> <strong th:text="${photo.spec.displayName ?: '未命名图片'}">未命名图片</strong> <span th:if="${not #strings.isEmpty(photo.spec.description)}" th:text="${photo.spec.description}">图片说明</span> </span> </a> </article>
