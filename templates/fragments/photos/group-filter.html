<!DOCTYPE html><nav class="fly-photos-filter fly-horizontal-nav" th:fragment="filter(groups, photoUrl)" th:if="${not #lists.isEmpty(groups)}" data-fly-photo-filter data-fly-taxonomy-carousel data-fly-reveal aria-label="图库分组"> <div id="fly-photos-filter-rail" class="fly-photos-filter-rail fly-horizontal-nav-rail" data-fly-taxonomy-carousel-rail> <a class="fly-photos-filter-item fly-horizontal-nav-item" href="/photos" th:href="@{${photoUrl.list()}}" aria-current="page" data-fly-photo-group="" data-fly-taxonomy-carousel-item>全部</a> <a class="fly-photos-filter-item fly-horizontal-nav-item" th:each="groupItem : ${groups}" th:href="@{${photoUrl.list(groupItem.metadata.name)}}" th:attr="data-fly-photo-group=${groupItem.metadata.name}" data-fly-taxonomy-carousel-item> <span th:text="${groupItem.spec.displayName}">分组</span> <small th:text="${groupItem.status.photoCount}">0</small> </a> </div> <th:block th:replace="~{fragments/horizontal-nav-arrow :: arrow(direction=${'prev'}, label=${'向前浏览图库分组'}, railId=${'fly-photos-filter-rail'}, controller=${'taxonomy-carousel'}, modifierClass=${'fly-photos-filter-arrow fly-photos-filter-arrow--prev'})}"></th:block> <th:block th:replace="~{fragments/horizontal-nav-arrow :: arrow(direction=${'next'}, label=${'向后浏览图库分组'}, railId=${'fly-photos-filter-rail'}, controller=${'taxonomy-carousel'}, modifierClass=${'fly-photos-filter-arrow fly-photos-filter-arrow--next'})}"></th:block> </nav>
