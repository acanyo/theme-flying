<!DOCTYPE html><nav class="fly-photo-navigation" th:fragment="navigation(photo, neighbors, prev, next, photoUrl)" data-fly-reveal aria-label="图片导航"> <div class="fly-photo-navigation-actions"> <a class="fly-photo-navigation-action fly-photo-navigation-action--prev" th:if="${prev != null}" th:href="@{${photoUrl.detail(prev)}}"> <span aria-hidden="true">←</span><span>上一张</span> </a> <a class="fly-photo-navigation-action fly-photo-navigation-action--next" th:if="${next != null}" th:href="@{${photoUrl.detail(next)}}"> <span>下一张</span><span aria-hidden="true">→</span> </a> </div> <div class="fly-photo-neighbors" th:if="${not #lists.isEmpty(neighbors)}"> <a class="fly-photo-neighbor" th:each="neighbor : ${neighbors}" th:href="@{${photoUrl.detail(neighbor)}}" th:classappend="${neighbor.metadata.name == photo.metadata.name} ? ' fly-is-active'" th:attr="aria-current=${neighbor.metadata.name == photo.metadata.name ? 'true' : null}"> <img src="/assets/images/fallback-cover.svg" th:src="${#strings.isEmpty(neighbor.spec.cover) ? neighbor.spec.url : neighbor.spec.cover}" th:alt="${neighbor.spec.displayName ?: ''}" width="1200" height="900" loading="lazy" decoding="async"> </a> </div> </nav>
