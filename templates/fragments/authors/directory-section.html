<!DOCTYPE html><th:block th:fragment="section(author, recentPosts, index)" th:with="postLimit=${6},authorPosts=${recentPosts.?[owner != null and owner.metadata.name == #vars.author.metadata.name]},railId=${'fly-authors-rail-' + index}"> <section class="fly-authors-directory-section" th:if="${author != null and not #lists.isEmpty(authorPosts)}" data-fly-carousel> <header class="fly-authors-directory-header" data-fly-reveal> <div class="fly-authors-profile-copy"> <div class="fly-authors-profile-name-row"> <img class="fly-authors-profile-avatar" src="/assets/images/avatar.svg" th:src="${author.avatar ?: #theme.assets('/images/avatar.svg')}" th:alt="${author.displayName ?: site.title}" alt="" width="46" height="46" loading="lazy" decoding="async"> <h2 th:text="${author.displayName ?: site.title}">作者姓名</h2> </div> <p th:if="${not #strings.isEmpty(author.bio)}" th:text="${author.bio}">
作者简介
</p> </div> <th:block th:replace="~{fragments/section-view-link :: link(targetHref=${author.permalink ?: '/'}, label=${'查看主页'})}"></th:block> </header> <div class="fly-authors-post-carousel"> <div class="fly-authors-post-rail" data-fly-carousel-rail data-fly-reveal-group th:id="${railId}"> <div class="fly-authors-post-slide" data-fly-carousel-item th:each="post, postStat : ${authorPosts}" th:if="${postStat.index < postLimit}"> <th:block th:replace="~{fragments/article-card :: card(post=${post}, variant=${'author-preview'})}"></th:block> </div> </div> <th:block th:replace="~{fragments/carousel-arrow :: arrow(direction=${'prev'}, label=${author.displayName ?: '作者文章'}, railId=${railId}, modifierClass=${'fly-authors-carousel-arrow'})}"></th:block> <th:block th:replace="~{fragments/carousel-arrow :: arrow(direction=${'next'}, label=${author.displayName ?: '作者文章'}, railId=${railId}, modifierClass=${'fly-authors-carousel-arrow'})}"></th:block> </div> </section> </th:block>
