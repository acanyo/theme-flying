<footer class="site-footer" th:fragment="footer">
  <div class="footer-shell">
    <section class="newsletter-panel">
      <div>
        <p class="eyebrow">Newsletter</p>
        <h2>Subscribe to our newsletter</h2>
        <p>Be the first to know about new posts and quiet updates.</p>
      </div>
      <form class="newsletter-form" data-newsletter novalidate>
        <label>
          <span class="sr-only">Email address</span>
          <input type="email" name="email" placeholder="email@example.com" autocomplete="email" />
        </label>
        <button class="button button--primary" type="submit">Subscribe</button>
        <p class="newsletter-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <div class="footer-links">
      <div>
        <a class="brand brand--footer" href="/" th:href="@{/}" th:text="${site.title}">flying</a>
        <p th:text="${site.subtitle ?: 'A minimal Halo theme inspired by Luno.'}">A minimal Halo theme inspired by Luno.</p>
      </div>

      <nav class="footer-nav-grid" aria-label="Footer navigation">
        <section class="footer-nav-group">
          <h2>Browse</h2>
          <a href="/" th:href="@{/}">Home</a>
          <a href="/archives" th:href="@{/archives}">Archives</a>
          <a href="/categories" th:href="@{/categories}">Categories</a>
          <a href="/tags" th:href="@{/tags}">Tags</a>
        </section>
        <section class="footer-nav-group">
          <h2>Pages</h2>
          <a href="/about" th:href="@{/about}">About</a>
          <a href="/contact" th:href="@{/contact}">Contact</a>
          <a href="/links" th:href="@{/links}">Links</a>
          <a href="/rss.xml" th:href="@{/rss.xml}">RSS</a>
        </section>
      </nav>
    </div>

    <p class="copyright">
      &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span>
      <span th:text="${site.title}">flying</span>.
    </p>
  </div>
  <halo:footer />
</footer>
