<!DOCTYPE html><div class="fly-footer-identity" th:fragment="identity(copyrightText, showCopyright, icpBeian, gonganBeian, gonganBeianUrl)" th:if="${showCopyright or not #strings.isEmpty(icpBeian) or not #strings.isEmpty(gonganBeian)}"> <p class="fly-footer-copyright" th:if="${showCopyright}"> <span th:text="|© ${#dates.format(#dates.createNow(), 'yyyy')} ${site.title} ·|">© 2026 站点 ·</span> <span th:text="${copyrightText}">版权所有 · 架构于</span> <a href="https://halo.run/" target="_blank" rel="noopener noreferrer"><strong>Halo</strong></a> <span>及为您增强体验的</span> <a href="https://github.com/acanyo/theme-flying" target="_blank" rel="noopener noreferrer">Flying</a> </p> <div class="fly-footer-records" aria-label="备案信息" th:if="${not #strings.isEmpty(icpBeian) or not #strings.isEmpty(gonganBeian)}"> <a class="fly-footer-record" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" th:if="${not #strings.isEmpty(icpBeian)}"> <img class="fly-footer-record-icon" src="/assets/images/icp-beian.webp" th:src="@{/assets/images/icp-beian.webp}" alt="" aria-hidden="true" loading="lazy" decoding="async"> <span th:text="${icpBeian}">ICP备案号</span> </a> <a class="fly-footer-record" href="https://beian.mps.gov.cn/#/query/webSearch" target="_blank" rel="noopener noreferrer" th:if="${not #strings.isEmpty(gonganBeian)}" th:href="@{${#strings.isEmpty(gonganBeianUrl) ? 'https://beian.mps.gov.cn/#/query/webSearch' : gonganBeianUrl}}"> <img class="fly-footer-record-icon" src="/assets/images/gongan-beian.png" th:src="@{/assets/images/gongan-beian.png}" alt="" aria-hidden="true" loading="lazy" decoding="async"> <span th:text="${gonganBeian}">公安备案号</span> </a> </div> </div> <nav class="fly-footer-navigation" aria-label="底部导航" th:fragment="navigation(footerLinks, placement)" th:classappend="${placement == 'sidebar' ? 'fly-footer-navigation--sidebar' : 'fly-footer-navigation--content'}" th:if="${not #lists.isEmpty(footerLinks)}"> <ul> <li th:each="link : ${footerLinks}" th:if="${not #strings.isEmpty(link['label']) and not #strings.isEmpty(link['url'])}"> <a class="fly-footer-link" href="/" th:href="@{${link['url']}}" th:target="${link['new_tab'] == true ? '_blank' : null}" th:rel="${link['new_tab'] == true ? 'noopener noreferrer' : null}"> <span th:text="${link['label']}">导航</span> </a> </li> </ul> </nav>
