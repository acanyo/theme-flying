<!DOCTYPE html><th:block th:fragment="head(pageKind, pageTitle, pageUrl)"> <link rel="alternate" type="application/rss+xml" title="站点 RSS 订阅" href="/rss.xml" th:title="|${site.title} RSS 订阅|" th:href="@{/rss.xml}"> <th:block th:if="${pageKind == 'links'}" th:with="pageDescription=${theme.config.pages?.links_description ?: '发现值得持续关注的网站与创作者，在彼此分享的内容和观点之间建立连接。'}, rawPageImage=${theme.config.pages?.links_cover ?: site.logo}, pageImage=${#strings.isEmpty(rawPageImage) or #strings.startsWith(rawPageImage, 'http') ? rawPageImage : site.url + rawPageImage}"> <th:block th:replace="~{fragments/seo/social-meta :: meta(pageTitle=${pageTitle}, pageDescription=${pageDescription}, pageUrl=${pageUrl}, pageImage=${pageImage}, pageImageAlt=${theme.config.pages?.links_title ?: linksTitle}, ogType=${'website'})}"></th:block> </th:block> <th:block th:if="${pageKind == 'photo-detail'}" th:with="pageDescription=${#strings.isEmpty(photo.spec.description) ? (photo.spec.displayName ?: site.title) : photo.spec.description}, rawPageImage=${#strings.isEmpty(photo.spec.cover) ? photo.spec.url : photo.spec.cover}, pageImage=${#strings.startsWith(rawPageImage, 'http') ? rawPageImage : site.url + rawPageImage}"> <th:block th:replace="~{fragments/seo/social-meta :: meta(pageTitle=${pageTitle}, pageDescription=${pageDescription}, pageUrl=${pageUrl}, pageImage=${pageImage}, pageImageAlt=${photo.spec.displayName ?: '图片'}, ogType=${'article'})}"></th:block> </th:block> <th:block th:replace="~{fragments/seo/site :: site}"></th:block> </th:block>
