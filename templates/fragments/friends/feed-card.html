<!DOCTYPE html><article class="fly-friend-feed-card" th:fragment="card(feed)" th:with="sourceName=${#strings.isEmpty(feed.author) ? feed.linkName : feed.author}" data-fly-friend-feed-card> <a class="fly-friend-feed-logo" th:href="${#strings.isEmpty(feed.authorUrl) ? feed.url : feed.authorUrl}" target="_blank" rel="noopener noreferrer" th:attr="aria-label=|访问：${#strings.isEmpty(sourceName) ? feed.url : sourceName}|"> <span class="fly-friend-feed-logo-fallback" aria-hidden="true"></span> <img class="fly-friend-feed-logo-image" th:if="${not #strings.isEmpty(feed.authorLogo)}" th:src="${feed.authorLogo}" th:alt="${sourceName}" width="48" height="48" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-fly-friend-feed-image> </a> <div class="fly-friend-feed-content"> <div class="fly-friend-feed-source"> <a class="fly-friend-feed-source-name" th:if="${not #strings.isEmpty(sourceName)}" th:href="${#strings.isEmpty(feed.authorUrl) ? feed.url : feed.authorUrl}" target="_blank" rel="noopener noreferrer" th:text="${sourceName}"></a> <time th:datetime="${feed.publishedAt}" th:text="${#dates.format(feed.publishedAt, 'yyyy年MM月dd日')}"></time> </div> <h2 class="fly-friend-feed-title"> <a th:href="${feed.url}" target="_blank" rel="noopener noreferrer" th:text="${#strings.isEmpty(feed.title) ? feed.url : feed.title}"></a> </h2> <p class="fly-friend-feed-summary" th:if="${not #strings.isEmpty(feed.summary) and not #strings.contains(feed.summary, '<') and not #strings.contains(feed.summary, '>')}" th:text="${feed.summary}"></p> </div> </article>
