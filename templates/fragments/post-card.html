<article
  class="post-card"
  th:fragment="card(post)"
  data-post-card
  th:attr="data-category=${not #lists.isEmpty(post.categories) ? post.categories[0].metadata.name : 'uncategorized'},data-title=${post.spec.title},data-excerpt=${post.status.excerpt ?: ''}"
>
  <a class="post-image-link" href="/" th:href="@{${post.status.permalink}}">
    <img
      class="post-cover"
      src="/assets/images/fallback-cover.svg"
      th:src="${#strings.isEmpty(post.spec.cover) ? #theme.assets('/images/fallback-cover.svg') : post.spec.cover}"
      th:alt="${post.spec.title}"
      alt=""
      loading="lazy"
    />
  </a>
  <div class="post-body">
    <a
      class="post-chip"
      href="/"
      th:href="@{${not #lists.isEmpty(post.categories) ? post.categories[0].status.permalink : post.status.permalink}}"
      th:text="${not #lists.isEmpty(post.categories) ? post.categories[0].spec.displayName : 'Journal'}"
    >Journal</a>
    <h2 class="post-title">
      <a href="/" th:href="@{${post.status.permalink}}" th:text="${post.spec.title}">Story title</a>
    </h2>
    <p class="post-excerpt" th:if="${not #strings.isEmpty(post.status.excerpt)}" th:text="${post.status.excerpt}">
      Story excerpt
    </p>
    <footer class="post-meta">
      <a class="author-pill" href="/" th:href="@{${post.owner?.permalink ?: post.status.permalink}}">
        <img
          src="/assets/images/avatar.svg"
          th:src="${post.owner?.avatar ?: #theme.assets('/images/avatar.svg')}"
          th:alt="${post.owner?.displayName ?: site.title}"
          alt=""
        />
        <span th:text="${post.owner?.displayName ?: site.title}">Author</span>
      </a>
      <span class="dot" aria-hidden="true"></span>
      <time th:datetime="${post.spec.publishTime}" th:text="${#dates.format(post.spec.publishTime, 'yyyy-MM-dd')}">
        2026-07-08
      </time>
    </footer>
    <div class="post-tags" th:if="${not #lists.isEmpty(post.tags)}">
      <a th:each="tag : ${post.tags}" th:href="@{${tag.status.permalink}}" th:text="${tag.spec.displayName}">Tag</a>
    </div>
  </div>
</article>
