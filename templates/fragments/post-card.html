<!DOCTYPE html><article class="fly-post-card" th:fragment="card(post)" data-fly-post-card th:attr="data-fly-post-name=${post.metadata.name},data-fly-category=${not #lists.isEmpty(post.categories) ? post.categories[0].metadata.name : 'uncategorized'},data-fly-title=${post.spec.title},data-fly-excerpt=${post.status.excerpt ?: ''}"> <div class="fly-post-image-frame"> <a class="fly-post-image-link" href="/" th:href="@{${post.status.permalink}}" th:attr="aria-label=|阅读：${post.spec.title}|"> <img class="fly-post-cover" src="/assets/images/fallback-cover.svg" th:src="${#strings.isEmpty(post.spec.cover) ? #theme.assets('/images/fallback-cover.svg') : post.spec.cover}" th:alt="${post.spec.title}" alt="" loading="lazy"> </a> <a class="fly-post-chip fly-post-chip--image" href="/" th:href="@{${not #lists.isEmpty(post.categories) ? post.categories[0].status.permalink : post.status.permalink}}" th:text="${not #lists.isEmpty(post.categories) ? post.categories[0].spec.displayName : '文章'}">文章</a> </div> <div class="fly-post-body"> <h2 class="fly-post-title"> <a href="/" th:href="@{${post.status.permalink}}" th:text="${post.spec.title}">文章标题</a> </h2> <p class="fly-post-excerpt" th:if="${not #strings.isEmpty(post.status.excerpt)}" th:text="${post.status.excerpt}">
文章摘要
</p> <div class="fly-post-tags" th:if="${not #lists.isEmpty(post.tags)}" aria-label="文章标签"> <a href="/" th:each="tag, tagIter : ${post.tags}" th:if="${tagIter.index < 2}" th:href="@{${tag.status.permalink}}" th:text="|#${tag.spec.displayName}|">#标签</a> </div> <footer class="fly-post-meta"> <a class="fly-author-pill" href="/" th:href="@{${post.owner?.permalink ?: post.status.permalink}}"> <img src="/assets/images/avatar.svg" th:src="${post.owner?.avatar ?: #theme.assets('/images/avatar.svg')}" th:alt="${post.owner?.displayName ?: site.title}" alt=""> <span th:text="${post.owner?.displayName ?: site.title}">作者</span> </a> <span class="fly-dot" aria-hidden="true"></span> <time th:datetime="${post.spec.publishTime}" th:text="${#dates.format(post.spec.publishTime, 'yyyy年MM月dd日')}">2026年07月08日</time> </footer> </div> </article>
