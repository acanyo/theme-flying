<!DOCTYPE html><section class="fly-post-related" th:fragment="related(result, currentPost)" th:if="${result != null and not #lists.isEmpty(result.items)}" data-fly-carousel role="region" aria-roledescription="carousel" aria-label="Read Next" tabindex="0"> <h2>Read Next</h2> <div class="fly-post-related-track"> <div id="fly-post-related-rail" class="fly-post-related-rail" data-fly-carousel-rail> <th:block th:each="item, iter : ${result.items}"> <th:block th:if="${item.metadata.name != currentPost.metadata.name and iter.index < 9}" th:replace="~{fragments/post/related :: card(item=${item})}"></th:block> </th:block> </div> <button class="fly-post-related-arrow fly-post-related-arrow--prev" type="button" data-fly-carousel-prev aria-label="Previous article" aria-controls="fly-post-related-rail"> <span class="fly-iconify fly-iconify--arrow-right" aria-hidden="true"></span> </button> <button class="fly-post-related-arrow fly-post-related-arrow--next" type="button" data-fly-carousel-next aria-label="Next article" aria-controls="fly-post-related-rail"> <span class="fly-iconify fly-iconify--arrow-right" aria-hidden="true"></span> </button> </div> </section> <article class="fly-post-related-card" th:fragment="card(item)" data-fly-carousel-item th:with="terms=${not #lists.isEmpty(item.tags) ? item.tags : item.categories}"> <a class="fly-post-related-media" href="/" th:href="@{${item.status.permalink}}" th:attr="aria-label=|Read: ${item.spec.title}|"> <th:block th:replace="~{fragments/post-cover-media :: media(post=${item}, mediaClass=${'fly-post-related-image'}, eager=${false})}"></th:block> <span class="fly-post-related-read">Read</span> </a> <div class="fly-post-related-summary"> <a class="fly-post-related-avatar" href="/" th:href="@{${item.owner?.permalink ?: item.status.permalink}}" th:attr="aria-label=${item.owner?.displayName ?: site.title}"> <img src="/assets/images/avatar.svg" th:src="${item.owner?.avatar ?: #theme.assets('/images/avatar.svg')}" th:alt="${item.owner?.displayName ?: site.title}" alt="" loading="lazy"> </a> <div> <h3> <a href="/" th:href="@{${item.status.permalink}}" th:text="${item.spec.title}">Article title</a> </h3> <p th:text="${item.owner?.displayName ?: site.title}">Author</p> <p class="fly-post-related-meta"> <time th:datetime="${item.spec.publishTime}" th:text="${#dates.format(item.spec.publishTime, 'MMM d, yyyy')}">Jul 11, 2024</time> <th:block th:if="${not #lists.isEmpty(terms)}"> <span aria-hidden="true">•</span> <span th:text="${terms[0].spec.displayName}">Tag</span> </th:block> </p> </div> </div> </article>
