<!DOCTYPE html><article class="fly-post-page" th:fragment="shell(post, haloCommentEnabled, readNext)" th:attr="data-fly-post-name=${post.metadata.name}" data-fly-post-page> <th:block th:replace="~{fragments/post/header :: header(post=${post}, haloCommentEnabled=${haloCommentEnabled})}"></th:block> <div class="fly-post-page-grid"> <th:block th:replace="~{fragments/post/tags :: tags(post=${post})}"></th:block> <th:block th:replace="~{fragments/post/sidebar :: sidebar(post=${post})}"></th:block> <div class="fly-post-page-body"> <th:block th:replace="~{fragments/post/body :: body(post=${post})}"></th:block> <th:block th:replace="~{fragments/post/author-card :: authorCard(post=${post}, placement='mobile')}"></th:block> </div> </div> <th:block th:replace="~{fragments/post/related :: related(readNext=${readNext}, currentPostName=${post.metadata.name})}"></th:block> <div class="fly-post-page-newsletter" data-fly-post-newsletter> <th:block th:replace="~{fragments/home/newsletter :: newsletter}"></th:block> </div> <th:block th:replace="~{fragments/post/comments :: comments(postName=${post.metadata.name}, enabled=${haloCommentEnabled})}"></th:block> </article>
