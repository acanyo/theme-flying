<!DOCTYPE html><header class="fly-post-page-header" th:fragment="header(post, commentsEnabled, layout)" th:classappend="| fly-post-page-header--${layout}|" th:attr="data-fly-post-layout=${layout}"> <th:block th:if="${layout == 'split'}"> <th:block th:replace="~{fragments/post/header :: media(post=${post})}"></th:block> </th:block> <div class="fly-post-page-header-copy"> <th:block th:replace="~{fragments/post/tags :: tags(post=${post})}"></th:block> <h1 class="fly-post-page-title" th:text="${post.spec.title}">文章标题</h1> <p class="fly-post-page-excerpt" th:if="${not #strings.isEmpty(post.status.excerpt)}" th:text="${post.status.excerpt}">
文章摘要
</p> <div class="fly-post-page-header-info"> <ul class="fly-post-page-meta" aria-label="文章信息"> <li class="fly-post-page-meta-author"> <a class="fly-post-page-meta-avatar" href="/" th:href="@{${post.owner?.permalink ?: post.status.permalink}}" th:attr="aria-label=${post.owner?.displayName ?: site.title}"> <img src="/assets/images/avatar.svg" th:src="${post.owner?.avatar ?: #theme.assets('/images/avatar.svg')}" th:alt="${post.owner?.displayName ?: site.title}" alt="" loading="eager"> </a> <span>作者</span> <a class="fly-post-page-meta-author-name" href="/" th:href="@{${post.owner?.permalink ?: post.status.permalink}}" th:text="${post.owner?.displayName ?: site.title}">作者名称</a> </li> <li class="fly-post-page-meta-separator" aria-hidden="true">•</li> <li> <time th:datetime="${post.spec.publishTime}" th:text="${#dates.format(post.spec.publishTime, 'yyyy年M月d日')}">2026年7月15日</time> </li> <li class="fly-post-page-meta-separator" aria-hidden="true">•</li> <li><span data-fly-reading-time>1 分钟阅读</span></li> </ul> <div class="fly-post-page-actions"> <button class="fly-post-page-action" type="button" data-fly-comments-open th:if="${commentsEnabled}" aria-controls="fly-post-comments" aria-expanded="false"> <span class="fly-iconify fly-iconify--comment" aria-hidden="true"></span> <span>评论</span> <span class="fly-post-comment-count" th:if="${post.status.commentsCount != null and post.status.commentsCount > 0}" th:text="${post.status.commentsCount}">0</span> </button> <div class="fly-post-page-share"> <button class="fly-post-page-action" type="button" data-fly-share-toggle aria-haspopup="menu" aria-expanded="false"> <span class="fly-iconify fly-iconify--share" aria-hidden="true"></span> <span>分享</span> </button> <div class="fly-post-share-menu" data-fly-share-menu role="menu" aria-hidden="true"> <button type="button" role="menuitem" data-fly-share-copy> <span class="fly-iconify fly-iconify--link" aria-hidden="true"></span> <span data-fly-share-copy-label>复制链接</span> </button> <a href="#" role="menuitem" data-fly-share-x target="_blank" rel="noopener noreferrer"> <span class="fly-post-share-letter" aria-hidden="true">X</span> <span>分享到 X</span> </a> <a href="#" role="menuitem" data-fly-share-facebook target="_blank" rel="noopener noreferrer"> <span class="fly-iconify fly-iconify--facebook" aria-hidden="true"></span> <span>分享到 Facebook</span> </a> <a href="#" role="menuitem" data-fly-share-linkedin target="_blank" rel="noopener noreferrer"> <span class="fly-post-share-letter" aria-hidden="true">in</span> <span>分享到 LinkedIn</span> </a> <a href="#" role="menuitem" data-fly-share-email> <span class="fly-iconify fly-iconify--mail" aria-hidden="true"></span> <span>邮件分享</span> </a> </div> </div> </div> </div> </div> </header> <div class="fly-post-page-media" th:fragment="media(post)"> <figure> <th:block th:replace="~{fragments/post-cover-media :: media(post=${post}, mediaClass=${'fly-post-page-cover'}, eager=${true})}"></th:block> </figure> </div>
