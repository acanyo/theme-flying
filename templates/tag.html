<!DOCTYPE html>
<html
  lang="zh-CN"
  th:replace="~{fragments/layout :: page(pageTitle=|${tag.spec.displayName} - ${site.title}|, bodyClass='fly-archive', content=~{::content})}"
>
  <th:block th:fragment="content">
    <div class="fly-content-shell">
      <header class="fly-page-header">
        <p class="fly-eyebrow">标签</p>
        <h1 th:text="${tag.spec.displayName}">标签</h1>
        <p th:text="|${posts.total} 篇文章|">0 篇文章</p>
      </header>

      <th:block th:replace="~{fragments/post-list :: grid(${posts})}"></th:block>
      <th:block th:replace="~{fragments/pagination :: pager(${posts})}"></th:block>
    </div>
  </th:block>
</html>
