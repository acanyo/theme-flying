<!DOCTYPE html>
<html
  lang="en"
  th:replace="~{fragments/layout :: page(pageTitle=|${category.spec.displayName} - ${site.title}|, bodyClass='flying-archive', content=~{::content})}"
>
  <th:block th:fragment="content">
    <div class="content-shell">
      <header class="page-header">
        <p class="eyebrow">Category</p>
        <h1 th:text="${category.spec.displayName}">Category</h1>
        <p th:text="|${posts.total} stories|">0 stories</p>
      </header>

      <th:block th:replace="~{fragments/post-list :: grid(${posts})}"></th:block>
      <th:block th:replace="~{fragments/pagination :: pager(${posts})}"></th:block>
    </div>
  </th:block>
</html>
