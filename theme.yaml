apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-flying
spec:
  displayName: "Fly"
  author:
    name: Handsome
    website: https://github.com/acanyo
  description: 一款面向 Halo 2 的内容型博客主题，提供三种首页布局、响应式侧栏、深浅色切换与沉浸式文章阅读体验。
  settingName: "theme-flying-setting"
  configMapName: "theme-flying-configMap"
  logo: /themes/theme-flying/assets/images/theme-flying-icon.png
  homepage: https://www.xhhao.com/
  issues: https://github.com/acanyo/theme-flying/issues
  customTemplates:
    page:
      - name: 所有作者
        file: authors.html
      - name: 全屏封面
        file: page_cover.html
      - name: RSS 朋友圈
        description: 使用链接管理插件的 RSS 订阅动态展示朋友们的最新文章
        file: page_friends.html
    post:
      - name: 分栏模板
        file: post_split.html
  version: "1.0.2"
  requires: ">=2.22.8"
  license:
    - name: "GPL-3.0"
      url: "https://www.gnu.org/licenses/gpl-3.0.en.html"
