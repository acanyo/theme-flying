apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-flying-setting
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: toggle
          name: home_layout
          label: 首页风格
          value: grid
          help: 选择首页顶部精选区域的展示风格；访客不能在前台自行切换。
          render-type: image
          size: 180
          gap: 12
          options:
            - label: 网格
              value: grid
              render: /themes/theme-flying/assets/images/layout-grid.svg?v=1.0.96
            - label: 横幅
              value: slider
              render: /themes/theme-flying/assets/images/layout-slider.svg?v=1.0.96
            - label: 轮播
              value: carousel
              render: /themes/theme-flying/assets/images/layout-carousel.svg?v=1.0.96
        - $formkit: array
          name: home_featured_posts
          label: 首页精选文章
          value: []
          max: 5
          addLabel: 添加精选文章
          emptyText: 未选择文章时，自动展示最新文章。
          help: 最多选择并排序 5 篇 Halo 文章；第一篇用于网格大图或轮播首屏。留空时自动读取最新文章。网格风格建议选择 5 篇以保持完整布局。
          itemLabels:
            - type: text
              label: $value.post
          children:
            - $formkit: postSelect
              name: post
              label: Halo 文章
              value: ""
              validation: required
              clearable: true
              searchable: true
        - $formkit: array
          name: home_sections
          label: 首页其他模块顺序
          value:
            - section: feed
            - section: authors
            - section: newsletter
            - section: topics
            - section: friends
          help: 顶部分类筛选和精选文章固定展示；拖动数组项调整其余模块顺序，删除数组项可隐藏对应模块。请勿重复添加同一模块。
          children:
            - $formkit: select
              name: section
              label: 首页模块
              value: ""
              validation: required
              clearable: false
              options:
                - label: 最新文章
                  value: feed
                - label: 我们的作者
                  value: authors
                - label: 订阅
                  value: newsletter
                - label: 分类专题
                  value: topics
                - label: 友情链接
                  value: friends
        - $formkit: text
          name: icp_beian
          label: ICP备案号
          value: ""
          placeholder: 请输入 ICP备案号
          help: 留空时不显示 ICP备案信息。
        - $formkit: text
          name: gongan_beian
          label: 公安备案号
          value: ""
          placeholder: 请输入公安备案号
          help: 留空时不显示公安备案信息。
        - $formkit: text
          name: gongan_beian_url
          label: 公安备案查询链接
          value: ""
          placeholder: 请输入完整查询链接
          help: 留空时跳转公安部互联网安全管理服务平台查询页。
        - $formkit: select
          name: home_link_group
          label: 首页友情链接分组
          value: ""
          placeholder: 请选择链接分组
          help: 选择“链接管理”插件中的一个分组在首页展示；不选择则隐藏友情链接版块。
          clearable: true
          searchable: true
          autoSelect: false
          action: /apis/core.halo.run/v1alpha1/linkgroups
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
            fieldSelectorKey: metadata.name

    - group: navigation
      label: 导航
      formSchema:
        - $formkit: menuRadio
          name: main_menu
          label: 主菜单
          value: ""
          help: 选择侧栏顶部展示的主导航菜单；不选择则隐藏主菜单区域。
        - $formkit: menuRadio
          name: feature_menu
          label: 更多功能菜单
          value: ""
          help: 选择侧栏“更多功能”区域展示的菜单；不选择则隐藏此区域。
        - $formkit: array
          name: footer_links
          label: 底部导航
          value: []
          help: 添加展示在展开侧栏和页面底部的导航链接；没有链接时自动隐藏底部导航。
          children:
            - $formkit: text
              name: label
              label: 名称
              value: ""
              validation: required
              placeholder: 例如 关于
            - $formkit: text
              name: url
              label: 链接
              value: ""
              validation: required
              placeholder: 例如 /about 或 https://example.com
            - $formkit: switch
              name: new_tab
              label: 新窗口打开
              value: false
        - $formkit: tagSelect
          name: tags
          label: 侧栏标签
          value: []
          multiple: true
          searchable: true
          clearable: true
          placeholder: 请选择标签
          help: 下拉多选侧栏标签区域展示的标签；不选择则隐藏标签区域。
        - $formkit: array
          name: sidebar_links
          label: 侧栏底部链接
          value: []
          help: 添加展示在侧栏底部的链接。图标使用 Iconify；需要 RSS 时可添加名称 RSS、链接 /rss.xml。
          children:
            - $formkit: text
              name: label
              label: 名称
              value: ""
              validation: required
              placeholder: 例如 RSS
            - $formkit: text
              name: url
              label: 链接
              value: ""
              validation: required
              placeholder: 例如 /rss.xml 或 https://example.com
            - $formkit: iconify
              name: icon
              label: 图标
              value: ""
              format: svg
              value-only: true
              help: 可选。收缩侧栏时建议为每个链接设置图标。
            - $formkit: switch
              name: show_label
              label: 显示文字
              value: false
              help: 开启后会在图标旁显示链接名称。
            - $formkit: switch
              name: new_tab
              label: 新窗口打开
              value: true

    - group: style
      label: 配色设置
      formSchema:
        - $formkit: color
          name: primary_color
          label: 主题主色
          value: "#000000"
          help: 用于按钮、链接、选中状态、焦点边框和 Halo 搜索组件。
        - $formkit: color
          name: secondary_color
          label: 主题辅助色
          value: "#000000"
          help: 用于弱强调、装饰元素和辅助交互；默认与主色一致以保持原版黑白风格。

    - group: advanced
      label: 高级设置
      formSchema:
        - $formkit: switch
          name: enable_swup
          id: advanced_enable_swup
          key: advanced_enable_swup
          label: 启用 Swup
          value: true
          help: 开启站内页面无刷新切换动画。
        - $formkit: number
          if: "$get(advanced_enable_swup).value === true"
          name: swup_timeout
          id: advanced_swup_timeout
          key: advanced_swup_timeout
          label: Swup 超时时间
          value: 5000
          help: 页面切换超时时间，单位为毫秒。
          min: 1000
          max: 60000
