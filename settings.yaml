apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-flying-setting
spec:
  forms:
    - group: basic
      label: 基础信息
      formSchema:
        - $formkit: toggle
          name: home_layout
          label: 首页风格
          value: grid
          help: 选择首页顶部精选区域的展示风格；访客不能在前台自行切换。
          render-type: image
          size: 180
          gap: 12
          options:
            - label: 网格
              value: grid
              render: /themes/theme-flying/assets/images/layout-grid.svg?v=1.0.96
            - label: 横幅
              value: slider
              render: /themes/theme-flying/assets/images/layout-slider.svg?v=1.0.96
            - label: 轮播
              value: carousel
              render: /themes/theme-flying/assets/images/layout-carousel.svg?v=1.0.96
        - $formkit: array
          name: home_featured_posts
          label: 首页精选文章
          value: []
          max: 5
          addLabel: 添加精选文章
          emptyText: 未选择文章时，自动展示最新文章。
          help: 最多选择并排序 5 篇 Halo 文章；第一篇用于网格大图或轮播首屏。留空时自动读取最新文章。网格风格建议选择 5 篇以保持完整布局。
          itemLabels:
            - type: text
              label: $value.post
          children:
            - $formkit: postSelect
              name: post
              label: Halo 文章
              value: ""
              validation: required
              clearable: true
              searchable: true
        - $formkit: array
          name: home_sections
          label: 首页其他模块顺序
          value:
            - section: feed
            - section: authors
            - section: newsletter
            - section: topics
            - section: friends
          help: 顶部分类筛选和精选文章固定展示；拖动数组项调整其余模块顺序，删除数组项可隐藏对应模块。请勿重复添加同一模块。
          children:
            - $formkit: select
              name: section
              label: 首页模块
              value: ""
              validation: required
              clearable: false
              options:
                - label: 最新文章
                  value: feed
                - label: 我们的作者
                  value: authors
                - label: 订阅
                  value: newsletter
                - label: 分类专题
                  value: topics
                - label: 友情链接
                  value: friends
        - $formkit: switch
          name: newsletter_enabled
          label: 启用订阅表单
          value: true
          help: 需要安装并启用提供邮件订阅接口的插件。
        - $formkit: text
          name: icp_beian
          label: ICP备案号
          value: ""
          placeholder: 请输入 ICP备案号
          help: 留空时不显示 ICP备案信息。
        - $formkit: text
          name: gongan_beian
          label: 公安备案号
          value: ""
          placeholder: 请输入公安备案号
          help: 留空时不显示公安备案信息。
        - $formkit: text
          name: gongan_beian_url
          label: 公安备案查询链接
          value: ""
          placeholder: 请输入完整查询链接
          help: 留空时跳转公安部互联网安全管理服务平台查询页。
        - $formkit: select
          name: home_link_group
          label: 首页友情链接分组
          value: ""
          placeholder: 请选择链接分组
          help: 选择“链接管理”插件中的一个分组在首页展示；不选择则隐藏友情链接版块。
          clearable: true
          searchable: true
          autoSelect: false
          action: /apis/core.halo.run/v1alpha1/linkgroups
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
            fieldSelectorKey: metadata.name
    - group: auth
      label: 认证界面
      formSchema:
        - $formkit: attachment
          name: cover
          label: 认证页面背景图
          value: ""
          help: 用于登录、注册、找回密码等认证页面左侧的背景视觉图；未选择时使用主题内置默认图片。

    - group: pages
      label: 主题页面
      formSchema:
        - $formkit: text
          name: categories_title
          label: 分类页标题
          value: 分类
        - $formkit: textarea
          name: categories_description
          label: 分类页说明
          value: 按主题浏览内容，发现感兴趣的文章。
        - $formkit: attachment
          name: categories_cover
          label: 分类页封面图
          value: ""
          help: 未选择时使用主题内置默认图片。
        - $formkit: text
          name: tags_title
          label: 标签页标题
          value: 标签
        - $formkit: textarea
          name: tags_description
          label: 标签页说明
          value: 使用标签轻松探索丰富多样的内容。查找特定主题、追踪内容趋势，并在广泛的主题与文章中发现新的兴趣，让每一次浏览都更快抵达你真正关心的方向。
        - $formkit: attachment
          name: tags_cover
          label: 标签页封面图
          value: ""
          help: 未选择时使用主题内置默认图片。
        - $formkit: text
          name: archives_title
          label: 归档页标题
          value: 文章归档
        - $formkit: textarea
          name: archives_description
          label: 归档页说明
          value: 汇集站点发布的全部文章，涵盖技术、生活与更多主题，在这里按时间探索感兴趣的内容。
        - $formkit: attachment
          name: archives_cover
          label: 归档页封面图
          value: ""
          help: 未选择时使用主题内置默认图片。
        - $formkit: text
          name: moments_title
          label: 瞬间页标题
          value: 瞬间
        - $formkit: textarea
          name: moments_description
          label: 瞬间页说明
          value: 记录生活中的片段、灵感与当下，让轻量的表达也能被认真收藏。
        - $formkit: attachment
          name: moments_cover
          label: 瞬间页封面图
          value: ""
          help: 未选择时使用主题内置默认图片。
        - $formkit: text
          name: photos_title
          label: 图库页标题
          value: 图库
        - $formkit: textarea
          name: photos_description
          label: 图库页说明
          value: 用影像收藏沿途所见，记录值得反复回看的片刻。
        - $formkit: attachment
          name: photos_cover
          label: 图库页封面图
          value: ""
          help: 未选择时使用主题内置默认图片。
        - $formkit: text
          name: links_title
          label: 友情链接页标题
          value: ""
          placeholder: 留空时使用链接管理插件中的页面标题
        - $formkit: textarea
          name: links_description
          label: 友情链接页说明
          value: 发现值得持续关注的网站与创作者，在彼此分享的内容和观点之间建立连接。
        - $formkit: attachment
          name: links_cover
          label: 友情链接页封面图
          value: ""
          help: 未选择时使用主题内置默认图片。
        - $formkit: switch
          name: links_application_enabled
          label: 开放友情链接申请
          value: true
          help: 需要在链接管理插件中同时开启友链申请和访客提交。
        - $formkit: text
          name: links_application_title
          label: 申请区标题
          value: 申请友情链接
        - $formkit: textarea
          name: links_application_form_description
          label: 申请区说明
          value: 请先在自己的网站添加本站链接，再填写站点资料提交申请。
        - $formkit: text
          name: links_application_site_title
          label: 本站友链名称
          value: ""
          placeholder: 留空时使用系统站点名称
          help: 对方添加友情链接时使用的站点名称。
        - $formkit: url
          name: links_application_site_url
          label: 本站友链地址
          value: ""
          placeholder: 留空时使用系统站点地址
          help: 建议填写对外可访问的正式地址，避免开发环境显示 localhost。
        - $formkit: textarea
          name: links_application_site_description
          label: 本站友链简介
          value: ""
          placeholder: 留空时使用系统 SEO 描述或站点副标题
          help: 建议填写一至两句话，便于对方直接添加本站友链。
        - $formkit: attachment
          name: links_application_site_logo
          label: 本站友链 Logo
          value: ""
          help: 留空时使用系统站点 Logo，建议使用清晰的正方形图片。
        - $formkit: url
          name: links_application_site_rss
          label: 本站 RSS 地址
          value: ""
          placeholder: 留空时使用 本站友链地址/rss.xml
        - $formkit: email
          name: links_application_site_email
          label: 友链联系邮箱
          value: ""
          placeholder: name@example.com
          help: 可选，留空时不在申请须知中显示邮箱。
        - $formkit: text
          name: friends_title
          label: RSS 朋友圈页标题
          value: ""
          placeholder: 留空时使用对应 Halo 单页的标题
        - $formkit: textarea
          name: friends_description
          label: RSS 朋友圈页说明
          value: ""
          placeholder: 留空时使用对应 Halo 单页的摘要
        - $formkit: attachment
          name: friends_cover
          label: RSS 朋友圈页封面图
          value: ""
          help: 未选择时优先使用对应 Halo 单页封面，其次使用主题内置默认图片。
    - group: navigation
      label: 导航
      formSchema:
        - $formkit: menuRadio
          name: main_menu
          label: 主菜单
          value: ""
          help: 选择侧栏顶部展示的主导航菜单；不选择则隐藏主菜单区域。
        - $formkit: menuRadio
          name: feature_menu
          label: 更多功能菜单
          value: ""
          help: 选择侧栏“更多功能”区域展示的菜单；不选择则隐藏此区域。
        - $formkit: array
          name: footer_links
          label: 底部导航
          value: []
          help: 添加展示在展开侧栏和页面底部的导航链接；没有链接时自动隐藏底部导航。
          children:
            - $formkit: text
              name: label
              label: 名称
              value: ""
              validation: required
              placeholder: 例如 关于
            - $formkit: text
              name: url
              label: 链接
              value: ""
              validation: required
              placeholder: 例如 /about 或 https://example.com
            - $formkit: switch
              name: new_tab
              label: 新窗口打开
              value: false
        - $formkit: tagSelect
          name: tags
          label: 精选标签
          value: []
          multiple: true
          searchable: true
          clearable: true
          placeholder: 请选择标签
          help: 用于侧栏标签区域、标签总览和标签详情页顶部导航；未选择时侧栏隐藏，标签总览仅保留顶部介绍且不显示标签分区，标签详情导航仅保留“全部文章”。
        - $formkit: array
          name: sidebar_links
          label: 侧栏底部链接
          value: []
          help: 添加展示在侧栏底部的链接。图标使用 Iconify；需要 RSS 时可添加名称 RSS、链接 /rss.xml。
          children:
            - $formkit: text
              name: label
              label: 名称
              value: ""
              validation: required
              placeholder: 例如 RSS
            - $formkit: text
              name: url
              label: 链接
              value: ""
              validation: required
              placeholder: 例如 /rss.xml 或 https://example.com
            - $formkit: iconify
              name: icon
              label: 图标
              value: ""
              format: svg
              value-only: true
              help: 可选。收缩侧栏时建议为每个链接设置图标。
            - $formkit: switch
              name: show_label
              label: 显示文字
              value: false
              help: 开启后会在图标旁显示链接名称。
            - $formkit: switch
              name: new_tab
              label: 新窗口打开
              value: true

    - group: style
      label: 配色设置
      formSchema:
        - $formkit: color
          name: primary_color
          label: 主题主色
          value: "#000000"
          help: 用于按钮、链接、选中状态、焦点边框和 Halo 搜索组件。
        - $formkit: color
          name: secondary_color
          label: 主题辅色
          value: "#ededed"
          help: 用于导航、标签、输入框等辅助界面的背景色，以及插件的次级配色。

    - group: advanced
      label: 高级设置
      formSchema:
        - $formkit: switch
          name: enable_swup
          id: advanced_enable_swup
          key: advanced_enable_swup
          label: 启用 Swup
          value: true
          help: 开启站内页面无刷新切换动画。
        - $formkit: number
          if: "$get(advanced_enable_swup).value === true"
          name: swup_timeout
          id: advanced_swup_timeout
          key: advanced_swup_timeout
          label: Swup 超时时间
          value: 5000
          help: 页面切换超时时间，单位为毫秒。
          min: 1000
          max: 60000
